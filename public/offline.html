<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f3" />
    <title>Offline — 日本語 Vocab</title>
    <style>
      :root { color-scheme: light; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f6f5f3;
        color: #3a3835;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main { max-width: 22rem; }
      img { width: 64px; height: 64px; border-radius: 14px; }
      h1 { margin: 20px 0 6px; font-size: 1.25rem; font-weight: 600; }
      p { margin: 0 0 24px; color: #6b6762; }
      button {
        height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: #3a3835;
        color: #fff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #3a3835; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>Your words load from the internet. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Come back by itself once the connection returns.
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
